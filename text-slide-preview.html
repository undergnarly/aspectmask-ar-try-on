<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>text-slide — Figma import preview</title>
<link rel="stylesheet" href="css/style.css" />
<style>
  body { margin: 0; background: #030208; display: flex; justify-content: center; padding: 0; }
  .slide-frame { width: 390px; height: 520px; }
</style>
</head>
<body>

<div class="slide-frame">
  <div class="text-slide">
    <div class="text-slide-photo">
      <img src="assets/products/ruby-dune/12-text-slide.jpg" alt=""
           style="object-position:center 41%; transform-origin:center 41%; transform:scale(1.81);" />
      <div class="text-slide-photo-scrim"></div>
    </div>
    <img class="text-slide-watermark" src="assets/brand/logo-mark.png" alt="" aria-hidden="true" />
    <div class="text-slide-content">
      <p class="text-slide-heading">One of one</p>
      <p class="text-slide-subheading">Designer handmade accessory<br>one-of-a-kind piece - one for the whole world.</p>
      <ul class="text-slide-bullets">
        <li>Bends by hand to fit any face.</li>
        <li>Lightweight. Wear it all night.</li>
        <li>Travels easily — weighs next to nothing, box included.</li>
        <li>Soft against your skin, not wire.</li>
      </ul>
    </div>
  </div>
</div>

</body>
</html>
